# =============================================================================
# SI Access — single gate opener
# Core cards only. No HACS, no custom cards, no template sensors.
# =============================================================================
# Device slug assumed: si_access
#
# This matches the shipping SI Access build: one trigger output wired across the
# motor controller's pushbutton terminals, one opto input for gate state, and a
# temperature probe.
#
# ---------------------------------------------------------------------------
# WIRING ASSUMPTION — read this before you trust the state card
#
# The dashboard assumes the opto input is ENERGISED WHEN THE GATE IS CLOSED
# (a limit switch or the motor controller's "closed" status output).
#
# If yours is wired the other way round — energised when OPEN — swap the two
# words "Closed" and "Open" in the two conditional cards below. Nothing else
# changes.
#
# If you have no status output wired at all, delete the state card entirely.
# A trigger-only gate is a perfectly normal install; it just cannot tell you
# where the gate is, and a card that guesses is worse than no card.
# ---------------------------------------------------------------------------

views:
  - title: Gate
    path: gate
    icon: mdi:gate
    type: sections
    max_columns: 2
    dense_section_placement: true
    sections:

      - type: grid
        cards:
          - type: heading
            heading: Gate
            heading_style: title
            icon: mdi:gate

          - type: conditional
            conditions:
              - condition: state
                entity: binary_sensor.si_access_gate_input
                state: "on"
            card:
              type: tile
              entity: binary_sensor.si_access_gate_input
              name: Closed
              icon: mdi:gate
              color: grey

          - type: conditional
            conditions:
              - condition: state
                entity: binary_sensor.si_access_gate_input
                state: "off"
            card:
              type: tile
              entity: binary_sensor.si_access_gate_input
              name: Open
              icon: mdi:gate-open
              color: green

          - type: button
            entity: button.si_access_gate_trigger
            name: Trigger gate
            icon: mdi:gate-arrow-right
            show_state: false
            icon_height: 60px
            tap_action:
              action: toggle

          - type: markdown
            content: >
              The trigger pulses the motor controller's own pushbutton input for
              500 ms — exactly what your wall button or remote does. The motor's
              built-in logic decides whether that means open, stop or close.
              Nothing about that behaviour lives in Home Assistant.

      - type: grid
        cards:
          - type: heading
            heading: Diagnostics
            heading_style: title
            icon: mdi:heart-pulse

          - type: tile
            entity: sensor.si_access_temperature
            name: Controller temp
            icon: mdi:thermometer

          - type: entities
            title: Device
            entities:
              - entity: binary_sensor.si_access_gate_input
                name: Gate input (raw)
              - entity: sensor.si_access_si_serial
                name: Serial number
              - entity: sensor.si_access_si_identity
                name: Identity

      - type: grid
        cards:
          - type: heading
            heading: Activity
            heading_style: title
            icon: mdi:chart-timeline

          - type: history-graph
            hours_to_show: 48
            title: Gate state
            entities:
              - entity: binary_sensor.si_access_gate_input
                name: Gate input

      - type: grid
        cards:
          - type: history-graph
            hours_to_show: 48
            title: Controller temperature
            entities:
              - entity: sensor.si_access_temperature
                name: Temperature
