# =============================================================================
# SI Access — garage door
# Core cards only. No HACS, no custom cards, no template sensors.
# =============================================================================
# Device slug assumed: si_access
#
# Same hardware and same firmware as the single-gate dashboard — only the
# wording changes. One trigger output across the opener's pushbutton terminals,
# one opto input for door state.
#
# ---------------------------------------------------------------------------
# WIRING ASSUMPTION
#
# Assumes the opto input is ENERGISED WHEN THE DOOR IS CLOSED, which is how a
# reed switch on the bottom rail normally reads. Wired the other way? Swap
# 'Closed' and 'Open' in the two conditional cards below.
# ---------------------------------------------------------------------------
#
# WANT A PROPER GARAGE DOOR IN HOME ASSISTANT?
#
# With a small firmware addition the door can appear as a real HA `cover`
# entity — the standard garage card, voice control through Google/Alexa/Siri,
# and an openable in the mobile app. See docs/garage-cover.md.
# Once that is flashed, swap the two conditional cards below for:
#
#   - type: tile
#     entity: cover.si_access_garage_door
#     features:
#       - type: cover-open-close
#
# =============================================================================

views:
  - title: Garage
    path: garage
    icon: mdi:garage
    type: sections
    max_columns: 2
    dense_section_placement: true
    sections:

      - type: grid
        cards:
          - type: heading
            heading: Garage
            heading_style: title
            icon: mdi:garage

          - type: conditional
            conditions:
              - condition: state
                entity: binary_sensor.si_access_gate_input
                state: "on"
            card:
              type: tile
              entity: binary_sensor.si_access_gate_input
              name: Closed
              icon: mdi:garage
              color: grey

          - type: conditional
            conditions:
              - condition: state
                entity: binary_sensor.si_access_gate_input
                state: "off"
            card:
              type: tile
              entity: binary_sensor.si_access_gate_input
              name: Open
              icon: mdi:garage-open
              color: amber

          - type: button
            entity: button.si_access_gate_trigger
            name: Operate door
            icon: mdi:garage-alert
            show_state: false
            icon_height: 60px
            tap_action:
              action: toggle

          - type: markdown
            content: >
              The trigger pulses the opener's own pushbutton input for 500 ms —
              exactly what your wall button or remote does. On most openers a
              single press cycles open → stop → close, so what happens next
              depends on where the door is. That logic lives in the opener,
              not in Home Assistant.

      - type: grid
        cards:
          - type: heading
            heading: Diagnostics
            heading_style: title
            icon: mdi:heart-pulse

          - type: tile
            entity: sensor.si_access_temperature
            name: Controller temp
            icon: mdi:thermometer

          - type: entities
            title: Device
            entities:
              - entity: binary_sensor.si_access_gate_input
                name: Door input (raw)
              - entity: sensor.si_access_si_serial
                name: Serial number
              - entity: sensor.si_access_si_identity
                name: Identity

      - type: grid
        cards:
          - type: heading
            heading: Activity
            heading_style: title
            icon: mdi:chart-timeline

          - type: history-graph
            hours_to_show: 48
            title: Door state
            entities:
              - entity: binary_sensor.si_access_gate_input
                name: Door input

      - type: grid
        cards:
          - type: history-graph
            hours_to_show: 48
            title: Controller temperature
            entities:
              - entity: sensor.si_access_temperature
                name: Temperature
