# dashboard/subview.yaml
#
# Vollständige Unteransicht: Zusammenfassung, Reset-Button, Fortschrittsbalken
# und die komplette To-do-Liste.
#
# HACS-Abhängigkeiten: mushroom, card-mod, bar-card.
# Das @keyframes nudge muss global (Theme) oder auf dieser View vorhanden sein.

type: grid
cards:
  - type: heading
    heading: Übersicht

  - type: custom:mushroom-template-card
    primary: >-
      {% set g = state_attr('sensor.packliste_fortschritt','gepackt') | int(0) %}
      {% set o = state_attr('sensor.packliste_fortschritt','offen') | int(0) %}
      {{ 'Alles gepackt!' if o == 0 else g ~ ' gepackt, ' ~ o ~ ' zu packen' }}
    secondary: >-
      {% set t = state_attr('sensor.packliste_fortschritt','gesamt') | int(0) %}
      {{ states('sensor.packliste_fortschritt') }}% von {{ t }} erledigt
    icon: >-
      {{ 'mdi:bag-suitcase-off' if state_attr('sensor.packliste_fortschritt','offen') | int(0) == 0 else 'mdi:bag-suitcase' }}
    icon_color: >-
      {% set o = state_attr('sensor.packliste_fortschritt','offen') | int(0) %}
      {{ 'disabled' if o == 0 else 'green' if o <= 3 else 'orange' if o <= 7 else 'red' }}
    tap_action:
      action: none
    card_mod:
      style: |
        ha-card {
          {% if state_attr('sensor.packliste_fortschritt','offen') | int(0) > 0 %}
          --shape-animation: nudge 3s ease-in-out infinite;
          {% endif %}
        }

  - type: custom:mushroom-template-card
    primary: Liste zurücksetzen
    secondary: >-
      {% set g = state_attr('sensor.packliste_fortschritt','gepackt') | int(0) %}
      {{ 'Nichts zurückzusetzen' if g == 0 else g ~ ' wieder auf "offen"' }}
    icon: mdi:restore
    icon_color: >-
      {{ 'disabled' if state_attr('sensor.packliste_fortschritt','gepackt') | int(0) == 0 else 'blue' }}
    tap_action:
      action: call-service
      service: script.packliste_reset
      confirmation:
        text: Wirklich die komplette Packliste zurücksetzen?
    card_mod:
      style: |
        ha-card {
          {% if state_attr('sensor.packliste_fortschritt','gepackt') | int(0) == 0 %}
          pointer-events: none;
          opacity: 0.5;
          {% endif %}
        }

  - type: custom:bar-card
    name: Fortschritt
    positions:
      icon: "off"
      indicator: "off"
      name: inside
      value: inside
    min: 0
    max: 100
    height: 30px
    severity:
      - color: var(--red-color)
        from: 0
        to: 33
      - color: var(--amber-color)
        from: 34
        to: 66
      - color: var(--green-color)
        from: 67
        to: 100
    entities:
      - entity: sensor.packliste_fortschritt
    grid_options:
      columns: full

  - type: heading
    heading: Alle Einträge

  - type: todo-list
    entity: todo.packliste
