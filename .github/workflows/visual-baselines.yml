name: Refresh Linux visual baselines

# Visual snapshots are platform-specific: Playwright names a baseline after the
# OS that produced it, and macOS and Linux rasterise text differently. Run this
# by hand after a deliberate rendering change, then commit the artefact it
# produces.
on:
  workflow_dispatch:

jobs:
  baselines:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --no-frozen-lockfile
      - run: node scripts/sync-assets.mjs
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm build
      - run: pnpm test:e2e --update-snapshots
        continue-on-error: true
      - uses: actions/upload-artifact@v4
        with:
          name: linux-visual-baselines
          path: tests/e2e/**/*-linux.png
          retention-days: 14
